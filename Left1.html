<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Liên hệ - Cty Cổ phần Thương mại và Dịch vụ Sách ABC</title>
</head>
<body>

    <!-- Tiêu đề trang liên hệ: Size 6, in đậm, canh giữa -->
    <h1 align="center">
        <font size="6" color="blue"><b>TRANG LIÊN HỆ</b></font>
    </h1>

    <p align="center">
        Quý khách vui lòng điền thông tin vào mẫu dưới đây hoặc gửi trực tiếp về email: 
        <a href="mailto:hotro@abc.com">hotro@abc.com</a>
    </p>

    <hr>

    <!-- Biểu mẫu (Form) liên hệ đơn giản -->
    <form>
        <table align="center" cellpadding="5">
            <tr>
                <td>Họ và tên:</td>
                <td><input type="text" name="hoten" placeholder="Nhập họ tên của bạn..."></td>
            </tr>
            <tr>
                <td>Email liên hệ:</td>
                <td><input type="email" name="email" placeholder="Nhập email của bạn..."></td>
            </tr>
            <tr>
                <td>Nội dung tin nhắn:</td>
                <td>
                    <textarea name="noidung" rows="4" cols="30" placeholder="Nhập nội dung cần hỗ trợ..."></textarea>
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="submit" value="Gửi đi">
                    <input type="reset" value="Nhập lại">
                </td>
            </tr>
        </table>
    </form>

    <br>
    <!-- Liên kết quay lại trang chủ / giới thiệu -->
    <p align="center">
        <a href="Gioithieu.html">⬅ Quay lại trang Giới thiệu công ty</a>
    </p>

</body>
</html>
